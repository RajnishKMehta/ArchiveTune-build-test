name: Bump to new version

on:
  push:
    branches:
      - 'main'
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

jobs:
  check-version:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version and Tag
        id: check_version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f app/build.gradle.kts ]; then
            echo "Error: app/build.gradle.kts does not exist"
            exit 1
          fi

          NEW_VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)"

          if [ -z "$NEW_VERSION" ]; then
            echo "Error: Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          echo "Detected version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists. Skipping release."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$NEW_VERSION does not exist. Proceeding with release."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug output
        run: |
          echo "version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "new_version: ${{ steps.check_version.outputs.new_version }}"


  build:
    name: Build FOSS Universal Release
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Prepare F-Droid buildserver environment
        shell: bash
        run: chmod +x gradlew

      - name: Build FOSS Universal Release
        shell: bash
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            registry.gitlab.com/fdroid/fdroidserver:buildserver \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends openjdk-21-jdk-headless
              export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
              export PATH="$JAVA_HOME/bin:$PATH"
              ./gradlew clean assembleFossMobileUniversalRelease
            '

          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Locate FOSS Universal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | grep -Ei 'foss.*universal|universal.*foss' \
              | head -n 1 || true
          )"

          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "FOSS universal APK not found."
            echo
            echo "Available APK outputs:"
            find app/build/outputs/apk -type f -print || true
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/app-foss-mobile-universal-release-unsigned.apk

          echo "release_dir=release" >> "$GITHUB_OUTPUT"
          echo "apk=release/app-foss-mobile-universal-release-unsigned.apk" >> "$GITHUB_OUTPUT"

      - name: Sign FOSS APK
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ steps.apk.outputs.release_dir }}/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: Rename signed APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SIGNED_APKS < <(
            find release \
              -maxdepth 1 \
              -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )

          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK."
            echo "Found:"
            find release -maxdepth 1 -type f -print || true
            exit 1
          fi

          SIGNED_APK="${SIGNED_APKS[0]}"

          mv \
            "$SIGNED_APK" \
            release/app-foss-mobile-universal-release.apk

      - name: Verify signed APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="release/app-foss-mobile-universal-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Signed APK does not exist."
            exit 1
          fi

          echo "Signed APK:"
          ls -lh "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

      - name: Verify APK signature and installability
        shell: bash
        run: |
          set -euo pipefail

          APK="release/app-foss-mobile-universal-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "${APKSIGNER:-}" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v7
        with:
          name: app-foss-mobile-universal-release
          path: release/app-foss-mobile-universal-release.apk
          if-no-files-found: error


  create-release:
    name: Create FOSS Release
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download FOSS APK
        uses: actions/download-artifact@v8
        with:
          name: app-foss-mobile-universal-release
          path: release/

      - name: Verify downloaded APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/app-foss-mobile-universal-release.apk"

          if [ ! -f "$APK" ]; then
            echo "FOSS release APK was not downloaded."
            find release -type f -print || true
            exit 1
          fi

          echo "Release APK:"
          ls -lh "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

      - name: Resolve changelog range
        id: changelog_range
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"

          if [ -n "$LAST_TAG" ]; then
            FROM_REF="$LAST_TAG"
          else
            FROM_REF="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          echo "from_ref=$FROM_REF" >> "$GITHUB_OUTPUT"
          echo "to_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

          echo "Changelog range:"
          echo "$FROM_REF -> ${{ github.sha }}"

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          fromTag: ${{ steps.changelog_range.outputs.from_ref }}
          toTag: ${{ steps.changelog_range.outputs.to_ref }}
          configurationJson: |
            {
              "template": "# Changelog\n\n#{{CHANGELOG}}\n\n<details>\n<summary>Other changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n",
              "pr_template": "- #{{TITLE}} — by @#{{AUTHOR}}",
              "categories": [
                {
                  "title": "## Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## Performance",
                  "labels": ["perf"]
                },
                {
                  "title": "## Refactors",
                  "labels": ["refactor"]
                },
                {
                  "title": "## Documentation",
                  "labels": ["docs"]
                },
                {
                  "title": "## Build / CI",
                  "labels": ["build", "ci"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?:\\s+.*$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="release/app-foss-mobile-universal-release.apk"

          cat > release_notes.md <<EOF
          ${{ steps.build_changelog.outputs.changelog }}
          EOF

          gh release create "v${{ needs.check-version.outputs.new_version }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.check-version.outputs.new_version }}" \
            --notes-file release_notes.md \
            "$APK"
