name: Test Cross-Environment Reproducibility (F-Droid Docker)

on:
  push:
    branches:
      - 'main'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
  workflow_dispatch:

jobs:
  reproducibility-test:
    name: Build & Compare (Dev Host vs F-Droid Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Environment Variables
        run: |
          # F-Droid builds use UTC timezone and C.UTF-8 locale
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
          # Set SOURCE_DATE_EPOCH from the last commit for reproducible timestamps
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      # -------------------------------------------------------------------------
      # 1. DEVELOPER BUILD (GitHub Actions Ubuntu Host)
      # -------------------------------------------------------------------------
      - name: Set up JDK 21 (Developer Environment)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Developer APK (Host)
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleFossMobileUniversalRelease --no-daemon

          mkdir -p artifacts/dev
          DEV_APK=$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei 'foss.*universal|universal.*foss' | head -n 1)
          
          if [ -z "${DEV_APK:-}" ] || [ ! -f "$DEV_APK" ]; then
            echo "Error: Developer APK not found."
            find app/build/outputs/apk -type f -print || true
            exit 1
          fi

          cp "$DEV_APK" artifacts/dev/apk1-dev-build.apk
          echo "Developer APK built successfully: artifacts/dev/apk1-dev-build.apk"

      # -------------------------------------------------------------------------
      # 2. F-DROID CONTAINER BUILD (Docker / fdroidserver environment)
      # -------------------------------------------------------------------------
      - name: Build in F-Droid Docker Buildserver
        run: |
          set -euo pipefail
          mkdir -p artifacts/fdroid

          # Clean previous build artifacts
          ./gradlew clean --no-daemon

          # Run build inside the standard F-Droid build container
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/build \
            -w /build \
            -e TZ=UTC \
            -e LC_ALL=C.UTF-8 \
            -e SOURCE_DATE_EPOCH="${{ env.SOURCE_DATE_EPOCH }}" \
            -e PULL_REQUEST='false' \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e LASTFM_API_KEY="${{ secrets.LASTFM_API_KEY }}" \
            -e LASTFM_SECRET="${{ secrets.LASTFM_SECRET }}" \
            -e API_BEARER_TOKEN="${{ secrets.API_BEARER_TOKEN }}" \
            -e TOGETHER_BEARER_TOKEN="${{ secrets.TOGETHER_BEARER_TOKEN }}" \
            -e CANVAS_BEARER_TOKEN="${{ secrets.CANVAS_BEARER_TOKEN }}" \
            -e EXTRACTOR_BEARER="${{ secrets.EXTRACTOR_BEARER }}" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-bookworm \
            bash -c "
              set -euo pipefail
              export GRADLE_USER_HOME=/tmp/.gradle
              ./gradlew clean assembleFossMobileUniversalRelease --no-daemon
            "

          FDROID_APK=$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei 'foss.*universal|universal.*foss' | head -n 1)

          if [ -z "${FDROID_APK:-}" ] || [ ! -f "$FDROID_APK" ]; then
            echo "Error: F-Droid Docker APK not found."
            find app/build/outputs/apk -type f -print || true
            exit 1
          fi

          cp "$FDROID_APK" artifacts/fdroid/apk2-fdroid-docker-build.apk
          echo "F-Droid Docker APK built successfully: artifacts/fdroid/apk2-fdroid-docker-build.apk"

      # -------------------------------------------------------------------------
      # 3. VERIFICATION & COMPARISON
      # -------------------------------------------------------------------------
      - name: Compare Checksums and Analyze Differences
        run: |
          set -euo pipefail
          mkdir -p artifacts/report

          DEV_SHA=$(sha256sum artifacts/dev/apk1-dev-build.apk | awk '{print $1}')
          FDROID_SHA=$(sha256sum artifacts/fdroid/apk2-fdroid-docker-build.apk | awk '{print $1}')

          echo "=================================================="
          echo "REPRODUCIBILITY CHECK RESULT"
          echo "=================================================="
          echo "Developer Build SHA-256:     $DEV_SHA"
          echo "F-Droid Docker Build SHA-256: $FDROID_SHA"
          echo "=================================================="

          cat <<EOF > artifacts/report/reproducibility-summary.md
          # Reproducibility Test Report

          - **Developer Build (Host)**: \`$DEV_SHA\`
          - **F-Droid Docker Build**: \`$FDROID_SHA\`

          EOF

          if [ "$DEV_SHA" = "$FDROID_SHA" ]; then
            echo "STATUS: REPRODUCIBLE (Bit-for-bit identical)"
            echo "## Result: PASS" >> artifacts/report/reproducibility-summary.md
            echo "The APKs are bit-for-bit identical across environments." >> artifacts/report/reproducibility-summary.md
          else
            echo "STATUS: NOT REPRODUCIBLE (Differences found)"
            echo "## Result: MISMATCH" >> artifacts/report/reproducibility-summary.md
            echo "The APKs differ across environments. Download the artifacts to inspect zip/smali differences." >> artifacts/report/reproducibility-summary.md
          fi

          # Output summary to GitHub Step Summary
          cat artifacts/report/reproducibility-summary.md >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------------
      # 4. UPLOAD ARTIFACTS (BOTH APKS & REPORT)
      # -------------------------------------------------------------------------
      - name: Upload Developer APK (Artifact 1)
        uses: actions/upload-artifact@v7
        with:
          name: apk1-developer-build
          path: artifacts/dev/apk1-dev-build.apk
          if-no-files-found: error

      - name: Upload F-Droid Docker APK (Artifact 2)
        uses: actions/upload-artifact@v7
        with:
          name: apk2-fdroid-docker-build
          path: artifacts/fdroid/apk2-fdroid-docker-build.apk
          if-no-files-found: error

      - name: Upload Reproducibility Report
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-report
          path: artifacts/report/
          if-no-files-found: warn
