name: Build & Compare Unsigned APKs (Dev Host vs F-Droid Style)

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  compare-unsigned-builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Common dummy/empty env variables taaki dono builds ka input 100% same rahe
      - name: Build Dev Unsigned APK (Build #1)
        env:
          PULL_REQUEST: 'false'
          LASTFM_API_KEY: ""
          LASTFM_SECRET: ""
          API_BEARER_TOKEN: ""
          TOGETHER_BEARER_TOKEN: ""
          CANVAS_BEARER_TOKEN: ""
          EXTRACTOR_BEARER: ""
        run: |
          set -euo pipefail
          echo "Building Dev Unsigned APK..."
          ./gradlew clean assembleFossMobileUniversalRelease --no-daemon --no-build-cache

          mkdir -p /tmp/build-dev
          DEV_APK=$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei 'foss.*universal|universal.*foss' | head -n 1)
          cp "$DEV_APK" /tmp/build-dev/app-dev-unsigned.apk
          echo "Dev APK SHA256: $(sha256sum /tmp/build-dev/app-dev-unsigned.apk)"

      - name: Build Second Unsigned APK (Build #2 - Clean Environment)
        env:
          PULL_REQUEST: 'false'
          LASTFM_API_KEY: ""
          LASTFM_SECRET: ""
          API_BEARER_TOKEN: ""
          TOGETHER_BEARER_TOKEN: ""
          CANVAS_BEARER_TOKEN: ""
          EXTRACTOR_BEARER: ""
        run: |
          set -euo pipefail
          echo "Building Clean Unsigned APK..."
          ./gradlew clean assembleFossMobileUniversalRelease --no-daemon --no-build-cache

          mkdir -p /tmp/build-fdroid
          FDROID_APK=$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei 'foss.*universal|universal.*foss' | head -n 1)
          cp "$FDROID_APK" /tmp/build-fdroid/app-fdroid-unsigned.apk
          echo "F-Droid Style APK SHA256: $(sha256sum /tmp/build-fdroid/app-fdroid-unsigned.apk)"

      - name: Compare Checksums
        run: |
          set -euo pipefail
          SHA_DEV=$(sha256sum /tmp/build-dev/app-dev-unsigned.apk | awk '{print $1}')
          SHA_FDROID=$(sha256sum /tmp/build-fdroid/app-fdroid-unsigned.apk | awk '{print $1}')

          echo "=========================================="
          echo "Dev Build SHA256:     $SHA_DEV"
          echo "Clean Build SHA256:   $SHA_FDROID"
          echo "=========================================="

          if [ "$SHA_DEV" != "$SHA_FDROID" ]; then
            echo "::error::APKs are NOT identical!"
            exit 1
          fi
          echo "SUCCESS: Both unsigned builds are 100% reproducible and identical."

      - name: Upload Unsigned APK Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-apk-comparison
          path: |
            /tmp/build-dev/app-dev-unsigned.apk
            /tmp/build-fdroid/app-fdroid-unsigned.apk
